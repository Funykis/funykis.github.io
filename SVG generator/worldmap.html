<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>点阵世界地图生成器</title>
<style>
:root{--ink:#16263A;--sub:#5B6B7C;--paper:#F2F5F8;--panel:#FFFFFF;--line:#D6DEE6;--accent:#0B7A75;--on:#FFFFFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E6EDF4;--sub:#9AA9B8;--paper:#101922;--panel:#17222D;--line:#2B3947;--accent:#3FC1B8;--on:#06211F}}
:root[data-theme="dark"]{--ink:#E6EDF4;--sub:#9AA9B8;--paper:#101922;--panel:#17222D;--line:#2B3947;--accent:#3FC1B8;--on:#06211F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 40px}
h1{font-size:26px;line-height:1.25;margin:0 0 6px;letter-spacing:.02em}
.lead{margin:0 0 22px;color:var(--sub);max-width:60ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.stage{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.stage.clear{background:conic-gradient(#d9dfe6 25%,#fff 0 50%,#d9dfe6 0 75%,#fff 0) 0 0/16px 16px}
.stage svg{display:block;width:100%;height:auto}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.stat{margin-left:auto;color:var(--sub);font-size:13px}
button{font:inherit;cursor:pointer}
.primary{background:var(--accent);color:var(--on);border:0;padding:9px 20px;border-radius:6px;font-weight:600}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px 16px;border-radius:6px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{min-height:1.6em;margin:8px 0 0;font-size:13px;color:var(--sub)}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px}
.row{margin-bottom:20px}.row:last-child{margin-bottom:0}
.lab{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
.lab output{font-weight:400;color:var(--sub);font-variant-numeric:tabular-nums}
.hint{margin:6px 0 0;font-size:12.5px;color:var(--sub)}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:9px 8px;display:flex;gap:8px;align-items:center;justify-content:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
input[type=color]{width:100%;height:36px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
@media(max-width:860px){.grid{grid-template-columns:1fr}.wrap{padding:20px 14px 32px}h1{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>点阵世界地图生成器</h1>
  <p class="lead">用方形或正六边形拼出世界陆地轮廓。调整点的大小和密度，满意后导出 SVG，可直接在 Illustrator、Figma 中继续编辑。</p>
  <div class="grid">
    <section>
      <div class="stage" id="stage" aria-label="点阵世界地图预览"></div>
      <div class="bar">
        <button class="primary" id="dl">导出 SVG</button>
        <button class="ghost" id="cp">复制 SVG 代码</button>
        <span class="stat" id="stat"></span>
      </div>
      <p id="msg" role="status"></p>
    </section>
    <aside class="ctl">
      <div class="row">
        <div class="lab">形状</div>
        <div class="seg" role="group" aria-label="点的形状">
          <button data-s="sq" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" fill="currentColor"/></svg>方形</button>
          <button data-s="hex" aria-pressed="true"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><polygon points="7,1 12.2,4 12.2,10 7,13 1.8,10 1.8,4" fill="currentColor"/></svg>六边形</button>
        </div>
      </div>
      <div class="row">
        <div class="lab"><label for="n">密度</label><output id="nv"></output></div>
        <input type="range" id="n" min="30" max="200" step="1" value="90">
        <p class="hint">横向排布的点数，越大越精细。</p></div><div class="row"><div class="lab"><label for="c">地图中心</label><output id="cv"></output></div><input type="range" id="c" min="-180" max="180" step="1" value="0"><p class="hint">居中的经线，0° 为格林尼治。东经 150° 可得到以太平洋为中心的亚太视角。</p>
      </div>
      <div class="row">
        <div class="lab"><label for="k">点大小</label><output id="kv"></output></div>
        <input type="range" id="k" min="30" max="100" step="1" value="85">
        <p class="hint">100% 时相邻的点紧密相接。</p>
      </div>
      <div class="row">
        <div class="cols">
          <div><label for="fg">点颜色</label><input type="color" id="fg" value="#12466b"></div>
          <div><label for="bg">背景色</label><input type="color" id="bg" value="#e4eef5"></div>
        </div>
        <label class="chk"><input type="checkbox" id="clear">透明背景</label>
      </div>
    </aside>
  </div>
</div>

AAAAAAAAf/////4AAAAAAAAAAAAAAAAAAAAAAB///4AAAAAAAAAAAAAAAAAAAAAAAAAAAAH//+AAD/////+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//////4AAAAAAAAAAAAAAAAAAAAAAA///gAAAAAAAAAAAAAAAAAAAAAAAAAAAAH//4AAB/////8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//////wAAAAAAAAAAAAAAAAAAAAAAA//+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAP//wAAA9////4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//////gAAAAAAAAAAAAAAAAAAAAAAA/wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP+CAAAA5////4AAAAAACAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB////+eAAAAAAAAAAAAAAAAAAAAAAAAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD+AAAAAT////wAAAAAAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB/////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB4AAAAAH////wAAAAAADgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA////gAAAAAABgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/////gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH///gAAAAAABwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH/////gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH///AAAAAAAA8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP/////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH///AAAAAAAAcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP/////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//+AAAAAAAAf8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP////+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB//gAAAAAAAAf4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHPAAAAAAAAAf4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH///wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAAAAAAAB/wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP///wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB/gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP///wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEPAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP///wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAYYAAAAAAAPPAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf//zgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf4AAAAAAAP+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf//wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP4AAAAAAAfoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf//+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP4AAAAAAAfAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAb///AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPwAAAAAAA+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAb//wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHwAAAAAAB8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH//wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADAAAAAAAf+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf//wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf//wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB/gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA///gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB//4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA///gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB///gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB///gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB//4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB//gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//AAAoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB//gAH+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//wACQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP3wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH/4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB//AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf9wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA",MW=720,MH=284,P=16,MAPW=1000,HM=MAPW*MH/MW,F=MW/MAPW;
const bin=atob(MASK),mask=new Uint8Array(bin.length);
for(let i=0;i<bin.length;i++)mask[i]=bin.charCodeAt(i);
let shift=0;
const land=(x,y)=>{if(x<0||y<0||x>=MW||y>=MH)return 0;const i=y*MW+(x+shift)%MW;return(mask[i>>3]>>(7-(i&7)))&1};
function cover(x0,x1,y0,y1){
  const nx=Math.min(6,Math.max(2,Math.round(x1-x0))),ny=Math.min(6,Math.max(2,Math.round(y1-y0)));
  let c=0;
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++)c+=land(Math.floor(x0+(i+.5)*(x1-x0)/nx),Math.floor(y0+(j+.5)*(y1-y0)/ny));
  return c/(nx*ny);
}
const $=id=>document.getElementById(id),r2=v=>+v.toFixed(2),st={shape:'hex'};
let svg='',count=0;
function build(){
  const n=+$('n').value,k=+$('k').value/100,hex=st.shape==='hex';
  shift=((Math.round(+$('c').value*2)%MW)+MW)%MW;
  const s=MAPW/n,dy=hex?s*Math.sqrt(3)/2:s,R=s/Math.sqrt(3)*k,q=R*.866;
  const hp=[[0,-R],[q,-R/2],[q,R/2],[0,R],[-q,R/2],[-q,-R/2]];
  let body='';count=0;
  for(let r=0;;r++){
    const cy=P+dy/2+r*dy;
    if(cy-dy/2>=P+HM)break;
    const off=hex&&r%2?s/2:0;
    for(let cx=P+s/2+off;cx-s/2<P+MAPW;cx+=s){
      if(cover((cx-s/2-P)*F,(cx+s/2-P)*F,(cy-dy/2-P)*F,(cy+dy/2-P)*F)<.4)continue;
      count++;
      body+=hex?`<polygon points="${hp.map(p=>r2(cx+p[0])+','+r2(cy+p[1])).join(' ')}"/>`
               :`<rect x="${r2(cx-s*k/2)}" y="${r2(cy-s*k/2)}" width="${r2(s*k)}" height="${r2(s*k)}"/>`;
    }
  }
  const W=MAPW+2*P,H=r2(HM+2*P);
  svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><title>点阵世界地图</title>`
    +($('clear').checked?'':`<rect width="100%" height="100%" fill="${$('bg').value}"/>`)
    +`<g fill="${$('fg').value}">${body}</g></svg>`;
}
function render(){
  build();
  const stg=$('stage');stg.innerHTML=svg;stg.classList.toggle('clear',$('clear').checked);
  $('nv').textContent=$('n').value+' 列';
  const cv=+$('c').value;$('cv').textContent=cv===0?'0°':(cv>0?'东经 ':'西经 ')+Math.abs(cv)+'°';$('kv').textContent=$('k').value+'%';
  $('stat').textContent=`共 ${count} 个${st.shape==='hex'?'六边形':'方块'}`;
}
let raf=0;const sched=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(render)};
document.querySelectorAll('input').forEach(e=>e.addEventListener('input',sched));
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{

});
const say=t=>{$('msg').textContent=t};
$('dl').onclick=()=>{

};

};
